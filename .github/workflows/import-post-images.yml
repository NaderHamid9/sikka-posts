name: Import Sikka Post Images

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Publication date (YYYY-MM-DD)'
        required: true
        type: string
      image_1_url:
        description: 'Public HTTPS URL for first PNG'
        required: true
        type: string
      image_2_url:
        description: 'Public HTTPS URL for second PNG'
        required: true
        type: string
      image_3_url:
        description: 'Public HTTPS URL for third PNG'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sikka-images-${{ inputs.date }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate date and download PNGs
        env:
          POST_DATE: ${{ inputs.date }}
          URL_1: ${{ inputs.image_1_url }}
          URL_2: ${{ inputs.image_2_url }}
          URL_3: ${{ inputs.image_3_url }}
        run: |
          python3 - <<'PY'
          import os, re, ssl, struct, urllib.parse, urllib.request
          from pathlib import Path
          day = os.environ["POST_DATE"]
          if not re.fullmatch(r"20\d{2}-\d{2}-\d{2}", day):
              raise SystemExit("Invalid date format")
          import datetime
          datetime.date.fromisoformat(day)
          target = Path("posts") / day
          target.mkdir(parents=True, exist_ok=True)
          for index in range(1, 4):
              url = os.environ[f"URL_{index}"]
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit(f"Image {index}: public HTTPS URL required")
              if parsed.hostname.lower() in ("localhost", "127.0.0.1", "::1"):
                  raise SystemExit("Local URLs are not allowed")
              request = urllib.request.Request(url, headers={"User-Agent": "SikkaImageImporter/1.0"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.geturl().split(":", 1)[0] != "https":
                      raise SystemExit("HTTPS redirect required")
                  data = response.read(12 * 1024 * 1024 + 1)
              if len(data) > 12 * 1024 * 1024 or len(data) < 24:
                  raise SystemExit(f"Image {index}: invalid size")
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"Image {index}: not a PNG")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (1080, 1350):
                  raise SystemExit(f"Image {index}: expected 1080x1350, got {width}x{height}")
              (target / f"post_{index}.png").write_bytes(data)
              print(f"Saved post_{index}.png: {len(data)} bytes")
          PY
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "posts/${{ inputs.date }}/"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Sikka posts for ${{ inputs.date }}"
            git push
          fi
